pluginGroup=dev.kristian
pluginName=GalenLinter
pluginVersion=0.3.0

# Where the built plugin will be hosted, used to generate updatePlugins.xml. Set it here to avoid
# passing -PpluginRepositoryUrl on every build. The release workflow overrides it with
# -PpluginDownloadUrl, which points straight at the GitHub release asset.
# pluginRepositoryUrl=https://your-host/idea-plugins

# The IntelliJ Platform ships its own Kotlin stdlib; bundling a second copy in the
# plugin distribution causes classloader conflicts.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
